<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0d0f14"><meta name="mobile-web-app-capable" content="yes"><title>René TV</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#0d0f14;color:#e8ecf4;font:15px system-ui,sans-serif;user-select:none}
#haut{position:sticky;top:0;z-index:5;background:#0d0f14ee;backdrop-filter:blur(8px);padding:10px 12px 0}
#etat{display:flex;align-items:center;gap:10px;background:#161a22;border-radius:14px;padding:8px 10px;min-height:54px}
#etat img{width:46px;height:34px;object-fit:contain;background:#fff1;border-radius:6px}#etat b{color:#ff3b5c;display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#etat small{color:#8b93a7}
#onglets{display:flex;gap:6px;margin:10px 0}#onglets button{flex:1;padding:11px 4px;font-size:15px;border-radius:11px}#onglets button.on{background:#ff3b5c}
button{background:#1d2230;color:#e8ecf4;border:0;border-radius:14px;padding:16px 6px;font-size:19px;font-weight:600}button:active{background:#ff3b5c}
.pane{display:none;padding:0 12px 90px}.pane.on{display:block}
.g{display:grid;gap:10px;margin-bottom:12px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}.gros{font-size:27px;padding:22px 6px}.rouge{background:#3a1420}
select,#cherche{width:100%;background:#1d2230;color:#e8ecf4;border:0;border-radius:12px;padding:13px;font-size:16px;margin-bottom:10px}
h3{margin:14px 0 8px;color:#8b93a7;font-size:12px;letter-spacing:.12em}
#grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.ch{background:#161a22;border-radius:12px;padding:8px 6px 6px;text-align:center;position:relative;min-height:96px}.ch:active{outline:2px solid #ff3b5c}
.ch.cur{outline:2px solid #ff3b5c;background:#2a0d14}
.ch img{width:100%;height:46px;object-fit:contain}.ch .sans{height:46px;display:flex;align-items:center;justify-content:center;font-size:24px;color:#3a4256}
.ch i{position:absolute;top:4px;left:6px;font-style:normal;font-size:12px;color:#ffcc33;font-weight:700}.ch span{display:block;font-size:12px;line-height:1.2;margin-top:4px;max-height:2.4em;overflow:hidden}
#mini{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#0d0f14f2;z-index:6}#mini button{padding:13px 0;font-size:18px}
#info{color:#8b93a7;font-size:13px;margin:6px 2px 10px}
</style></head><body>
<div id="haut"><div id="etat"><img id="elogo" alt=""><div style="min-width:0"><b id="ech">René TV</b><small id="esub">connexion…</small></div></div>
<div id="onglets"><button data-o="tele" class="on">🎮 Télécommande</button><button data-o="tv">📺 TV</button><button data-o="radio">📻 Radios</button></div></div>
<div class="pane on" id="p-tele">
<div class="g g2"><button class="gros" data-c="up">▲ CH+</button><button class="gros" data-c="volp">🔊 +</button><button class="gros" data-c="down">▼ CH−</button><button class="gros" data-c="volm">🔉 −</button></div>
<div class="g g3"><button data-c="pause">⏯</button><button data-c="mute">🔇</button><button data-c="plein">⛶</button></div>
<h3>NUMÉRO</h3>
<div class="g g3"><button data-n="1">1</button><button data-n="2">2</button><button data-n="3">3</button><button data-n="4">4</button><button data-n="5">5</button><button data-n="6">6</button><button data-n="7">7</button><button data-n="8">8</button><button data-n="9">9</button><button data-c="prec">↩ Préc.</button><button data-n="0">0</button><button class="rouge" data-c="retour">✕ Retour</button></div>
<h3>IMAGE</h3>
<select id="flu"><option value="0">Fluidité : Arrêt</option><option value="2">Fluidité ×2</option><option value="4">Fluidité ×4</option><option value="max">Fluidité MAX 240 Hz</option><option value="maxia">MAX intégré (240 Hz + IA 8K)</option></select>
<select id="ff"><option value="0">FFmpeg : Arrêt</option><option value="doux">Doux</option><option value="fort">Fort</option><option value="ia">Fort + IA</option><option value="max">IA Max</option><option value="s8k">IA 8K → 4K</option></select>
<select id="sty"><option value="naturel">Style : Naturel</option><option value="film">Film restauré</option><option value="cine">Ciné moderne</option><option value="vintage">Vintage chaud</option><option value="portrait">Portrait doux</option></select>
<h3>SOMMEIL</h3><div class="g g3"><button data-c="dodo:15">15 min</button><button data-c="dodo:30">30</button><button data-c="dodo:60">60</button></div>
</div>
<div class="pane" id="p-liste"><input id="cherche" type="search" placeholder="🔎 Chercher une chaîne ou un numéro…"><div id="info"></div><div id="grille"></div></div>
<div id="mini"><button data-c="down">CH−</button><button data-c="up">CH+</button><button data-c="volm">🔉</button><button data-c="volp">🔊</button><button data-c="mute">🔇</button></div>
<script>
const k=new URLSearchParams(location.search).get('k')||'',$=s=>document.querySelector(s);let L=[],onglet='tele',num='',numT=0,courant='';
const env=c=>fetch('/c?k='+encodeURIComponent(k)+'&c='+encodeURIComponent(c)).then(r=>r.json()).then(maj).catch(()=>{$('#esub').textContent='⚠ René TV injoignable'});
const parNom=s=>L.find(x=>s&&s.indexOf(x.nom)>=0);
function maj(s){if(!s||s.err){$('#esub').textContent=s&&s.err||'…';return}$('#ech').textContent=s.ch||'Accueil';$('#esub').textContent='🔊 '+s.vol+'% · '+({0:'fluidité arrêt',max:'240 Hz',maxia:'MAX intégré'}[s.flu]||'fluidité ×'+s.flu)+' · '+(s.ff==='0'?'sans FFmpeg':'FFmpeg '+s.ff);
 const x=parNom(s.ch);$('#elogo').src=x&&x.logo||'';$('#elogo').style.visibility=x&&x.logo?'visible':'hidden';
 if(s.ch!==courant){courant=s.ch;document.querySelectorAll('.ch.cur').forEach(e=>e.classList.remove('cur'));if(x){const e=document.querySelector('.ch[data-n="'+x.n+'"]');e&&e.classList.add('cur')}}
 for(const id of ['flu','ff','sty'])if(s[id]!=null&&document.activeElement.id!==id)$('#'+id).value=s[id]}
document.querySelectorAll('[data-c]').forEach(b=>b.addEventListener('click',()=>{navigator.vibrate&&navigator.vibrate(12);env(b.dataset.c)}));
document.querySelectorAll('[data-n]:not(.ch)').forEach(b=>b.addEventListener('click',()=>{navigator.vibrate&&navigator.vibrate(12);num+=b.dataset.n;$('#esub').textContent='N° '+num+'…';clearTimeout(numT);numT=setTimeout(()=>{env('ch:'+num);num=''},1200)}));
for(const id of ['flu','ff','sty'])$('#'+id).onchange=e=>env(id+':'+e.target.value);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function rend(){const q=$('#cherche').value.trim().toLowerCase(),tv=onglet==='tv';let A=L.filter(x=>(x.t==='tv')===tv);if(q)A=A.filter(x=>String(x.n)===q||x.nom.toLowerCase().includes(q));
 $('#info').textContent=A.length+(tv?' chaînes':' radios')+(q?' trouvées':'')+' — touche pour regarder';
 $('#grille').innerHTML=A.map(x=>'<div class="ch'+(courant&&courant.indexOf(x.nom)>=0?' cur':'')+'" data-n="'+x.n+'"><i>'+x.n+'</i>'+(x.logo?'<img loading="lazy" src="'+esc(x.logo)+'" onerror="this.outerHTML=\'<div class=sans>'+(tv?'📺':'📻')+'</div>\'">':'<div class="sans">'+(tv?'📺':'📻')+'</div>')+'<span>'+esc(x.nom)+'</span></div>').join('')}
$('#grille').addEventListener('click',e=>{const c=e.target.closest('.ch');if(!c)return;navigator.vibrate&&navigator.vibrate(15);env('ch:'+c.dataset.n)});
$('#cherche').oninput=rend;
document.querySelectorAll('#onglets button').forEach(b=>b.onclick=()=>{onglet=b.dataset.o;document.querySelectorAll('#onglets button').forEach(x=>x.classList.toggle('on',x===b));$('#p-tele').classList.toggle('on',onglet==='tele');$('#p-liste').classList.toggle('on',onglet!=='tele');if(onglet!=='tele'){$('#cherche').value='';rend();scrollTo(0,0)}});
const charge=()=>fetch('/liste?k='+encodeURIComponent(k)).then(r=>r.json()).then(a=>{if(Array.isArray(a)&&a.length){L=a;if(onglet!=='tele')rend()}else setTimeout(charge,4000)}).catch(()=>setTimeout(charge,4000));
charge();setInterval(()=>env('etat'),2500);env('etat');
</script></body></html>
